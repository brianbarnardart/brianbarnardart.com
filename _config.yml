title: Brian Barnard Art
# Appended to the home page's browser-tab/search-result title:
#   "Brian Barnard Art | Fernandina Beach Artist & Live Painter"
tagline: Fernandina Beach Artist & Live Painter
description: Fernandina Beach's live painter and muralist
url: "https://brianbarnardart.com"
baseurl: ""
lang: en-US

# Author info used by the minima theme
author: Brian Barnard

theme: minima

# Plugins loaded from Gemfile
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Jekyll build settings
markdown: kramdown
permalink: pretty

# Collections — each file in _<name>/ becomes a page
collections:
  works:
    output: true
    permalink: /works/:name/
  venues:
    output: true
    permalink: /venues/:name/
  events:
    output: true
    permalink: /events/:name/
  bands:
    output: true
    permalink: /bands/:name/
  interests:
    output: true
    permalink: /interests/:name/
  charities:
    output: true
    permalink: /charities/:name/
  characters:
    output: true
    permalink: /characters/:name/

# These files/dirs are excluded from the Jekyll build output
exclude:
  - README.md
  - LICENSE
  - USER-GUIDE.md
  - HOWTO.md
  - SEO-STRATEGY.md
  - AGENTS.md
  - CLAUDE.md
