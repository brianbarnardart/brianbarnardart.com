<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 256x256" type="image/x-icon">
<link rel="icon" href="/assets/icons/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/icons/favicon-192x192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/favicon-192x192.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#ffffff">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": ["Person", "VisualArtist"],
  "name": "{{ site.author | escape }}",
  "url": "{{ site.url }}{{ site.baseurl | default: '' }}/",
  "image": "{{ site.url }}{{ '/assets/brian-face.png' | relative_url }}",
  "jobTitle": "Artist and live painter",
  "description": "{{ site.description | escape }}",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Fernandina Beach",
    "addressRegion": "FL",
    "addressCountry": "US"
  },
  "homeLocation": {
    "@type": "Place",
    "name": "Fernandina Beach, Florida"
  },
  "areaServed": "Fernandina Beach, Florida",
  "sameAs": [
    "https://www.facebook.com/brianbarnardart/",
    "https://www.instagram.com/brianbarnardart/",
    "https://www.youtube.com/@brianbarnardart"
  ]
}
</script>
