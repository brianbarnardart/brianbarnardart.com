<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="760" fill="#fbf8f2"/>
  <text x="450" y="42" font-size="28" font-weight="700" text-anchor="middle" fill="#2b2b2b">How brianbarnardart.com works</text>
  <text x="450" y="68" font-size="15" text-anchor="middle" fill="#666">No monthly hosting bill. Only the domain name is paid for, once a year.</text>

  <text x="40" y="112" font-size="18" font-weight="700" fill="#2b2b2b">1. How a change goes live</text>
  <rect x="40" y="130" width="170" height="90" rx="10" fill="#e3f0ff" stroke="#4a86c5" stroke-width="2"/>
  <text x="125" y="165" font-size="15" font-weight="700" text-anchor="middle">You edit a page</text>
  <text x="125" y="187" font-size="13" text-anchor="middle" fill="#444">in a web browser</text>
  <text x="125" y="205" font-size="13" text-anchor="middle" fill="#444">(github.com)</text>

  <path d="M210 175 H255" stroke="#555" stroke-width="2.5" fill="none"/>
  <polygon points="255,168 268,175 255,182" fill="#555"/>

  <rect x="270" y="130" width="170" height="90" rx="10" fill="#fff4d6" stroke="#d1a21d" stroke-width="2"/>
  <text x="355" y="165" font-size="15" font-weight="700" text-anchor="middle">Automatic check</text>
  <text x="355" y="187" font-size="13" text-anchor="middle" fill="#444">like a spell-check</text>
  <text x="355" y="205" font-size="13" text-anchor="middle" fill="#444">for the whole site</text>

  <path d="M440 160 H485 V150 H510" stroke="#2f8f4e" stroke-width="2.5" fill="none"/>
  <polygon points="510,143 523,150 510,157" fill="#2f8f4e"/>
  <text x="478" y="136" font-size="12" fill="#2f8f4e" text-anchor="middle">passes</text>

  <path d="M440 190 H485 V215 H510" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <polygon points="510,208 523,215 510,222" fill="#c0392b"/>
  <text x="478" y="236" font-size="12" fill="#c0392b" text-anchor="middle">problem</text>

  <rect x="525" y="120" width="335" height="60" rx="10" fill="#e2f5e8" stroke="#2f8f4e" stroke-width="2"/>
  <text x="692" y="145" font-size="15" font-weight="700" text-anchor="middle">New site published (about 2 minutes)</text>
  <text x="692" y="165" font-size="13" text-anchor="middle" fill="#444">brianbarnardart.com shows your change</text>

  <rect x="525" y="190" width="335" height="60" rx="10" fill="#fde8e6" stroke="#c0392b" stroke-width="2"/>
  <text x="692" y="215" font-size="15" font-weight="700" text-anchor="middle">Red X shown. Old site stays up.</text>
  <text x="692" y="235" font-size="13" text-anchor="middle" fill="#444">Nothing is lost. Fix it or undo it.</text>

  <text x="40" y="300" font-size="18" font-weight="700" fill="#2b2b2b">2. What a visitor passes through (and who you pay or log into)</text>

  <rect x="40" y="320" width="190" height="100" rx="10" fill="#f0eafa" stroke="#7a5cb0" stroke-width="2"/>
  <text x="135" y="348" font-size="15" font-weight="700" text-anchor="middle">Domain name</text>
  <text x="135" y="368" font-size="13" text-anchor="middle" fill="#444">Network Solutions</text>
  <text x="135" y="388" font-size="13" font-weight="700" text-anchor="middle" fill="#a0301f">Yearly bill. Expires</text>
  <text x="135" y="406" font-size="13" font-weight="700" text-anchor="middle" fill="#a0301f">Feb 2, 2027</text>

  <path d="M230 370 H265" stroke="#555" stroke-width="2.5" fill="none"/>
  <polygon points="265,363 278,370 265,377" fill="#555"/>

  <rect x="280" y="320" width="190" height="100" rx="10" fill="#f0eafa" stroke="#7a5cb0" stroke-width="2"/>
  <text x="375" y="348" font-size="15" font-weight="700" text-anchor="middle">Address book (DNS)</text>
  <text x="375" y="368" font-size="13" text-anchor="middle" fill="#444">Bluehost</text>
  <text x="375" y="388" font-size="13" text-anchor="middle" fill="#444">Says "go to GitHub."</text>
  <text x="375" y="406" font-size="13" text-anchor="middle" fill="#444">Leave alone.</text>

  <path d="M470 370 H505" stroke="#555" stroke-width="2.5" fill="none"/>
  <polygon points="505,363 518,370 505,377" fill="#555"/>

  <rect x="520" y="320" width="190" height="100" rx="10" fill="#e3f0ff" stroke="#4a86c5" stroke-width="2"/>
  <text x="615" y="348" font-size="15" font-weight="700" text-anchor="middle">GitHub</text>
  <text x="615" y="368" font-size="13" text-anchor="middle" fill="#444">Holds all the pages</text>
  <text x="615" y="388" font-size="13" text-anchor="middle" fill="#444">and pictures, and</text>
  <text x="615" y="406" font-size="13" text-anchor="middle" fill="#444">shows them. Free.</text>

  <path d="M710 370 H745" stroke="#555" stroke-width="2.5" fill="none"/>
  <polygon points="745,363 758,370 745,377" fill="#555"/>

  <rect x="760" y="320" width="100" height="100" rx="10" fill="#e2f5e8" stroke="#2f8f4e" stroke-width="2"/>
  <text x="810" y="365" font-size="15" font-weight="700" text-anchor="middle">The</text>
  <text x="810" y="385" font-size="15" font-weight="700" text-anchor="middle">website</text>

  <rect x="520" y="470" width="190" height="70" rx="10" fill="#fff4d6" stroke="#d1a21d" stroke-width="2"/>
  <text x="615" y="497" font-size="15" font-weight="700" text-anchor="middle">FormSpark (free)</text>
  <text x="615" y="518" font-size="13" text-anchor="middle" fill="#444">Emails form messages</text>
  <path d="M810 420 V505 H712" stroke="#999" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <polygon points="712,498 700,505 712,512" fill="#999"/>

  <rect x="280" y="470" width="190" height="70" rx="10" fill="#fff4d6" stroke="#d1a21d" stroke-width="2"/>
  <text x="375" y="497" font-size="15" font-weight="700" text-anchor="middle">GoatCounter (free)</text>
  <text x="375" y="518" font-size="13" text-anchor="middle" fill="#444">Counts visitors, no cookies</text>
  <path d="M835 420 V580 H375 V542" stroke="#999" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <polygon points="368,545 375,532 382,545" fill="#999"/>

  <text x="40" y="618" font-size="18" font-weight="700" fill="#2b2b2b">3. If the site is ever "stuck"</text>
  <rect x="40" y="630" width="400" height="105" rx="10" fill="#fde8e6" stroke="#c0392b" stroke-width="2"/>
  <text x="240" y="656" font-size="15" font-weight="700" text-anchor="middle">Site goes OFFLINE if...</text>
  <text x="60" y="681" font-size="13" fill="#333">• The domain isn't renewed (card expired)</text>
  <text x="60" y="701" font-size="13" fill="#333">• The address-book entries are deleted</text>
  <text x="60" y="721" font-size="13" fill="#333">• Check both once a year</text>

  <rect x="460" y="630" width="400" height="105" rx="10" fill="#fff4d6" stroke="#d1a21d" stroke-width="2"/>
  <text x="660" y="656" font-size="15" font-weight="700" text-anchor="middle">Site stays up but can't be changed if...</text>
  <text x="480" y="681" font-size="13" fill="#333">• Nobody can log into GitHub</text>
  <text x="480" y="701" font-size="13" fill="#333">• Keep recovery codes + a 2nd person with access</text>
  <text x="480" y="721" font-size="13" fill="#333">• Logins live in a shared password manager</text>
</svg>
