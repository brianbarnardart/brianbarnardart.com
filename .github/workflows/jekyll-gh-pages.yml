name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Enforce SEO front-matter coverage
        run: |
          ruby - <<'RUBY'
          require "yaml"

          def truthy?(value)
            value == true || value.to_s.strip.downcase == "true"
          end

          def falsey?(value)
            value == false || value.to_s.strip.downcase == "false"
          end

          failures = []
          markdown_files = Dir.glob("**/*.md").reject do |path|
            path.start_with?(".git/", "_site/", "vendor/")
          end

          markdown_files.each do |path|
            raw = File.read(path)
            next unless raw.start_with?("---\n")

            match = raw.match(/\A---\s*\n(.*?)\n---\s*\n/m)
            next unless match

            begin
              fm = YAML.safe_load(match[1], permitted_classes: [], aliases: false) || {}
            rescue Psych::SyntaxError => e
              failures << "#{path}: invalid YAML front matter (#{e.message})"
              next
            end

            next unless fm["layout"]

            noindex = truthy?(fm["noindex"])
            sitemap_false = falsey?(fm["sitemap"])
            indexable = !(noindex || sitemap_false)
            next unless indexable

            description = fm["description"].to_s.strip
            image = fm["image"].to_s.strip

            failures << "#{path}: missing description for indexable page" if description.empty?
            failures << "#{path}: missing image for indexable page" if image.empty?
          end

          if failures.any?
            puts "SEO front-matter validation failed:"
            failures.each { |f| puts "  - #{f}" }
            exit 1
          end

          puts "SEO front-matter validation passed."
          RUBY

      # Soft check: shows a yellow warning (does not block publishing) for any
      # image over 1 MB.  Phone/camera photos are often 3-10 MB, which makes
      # pages crawl on mobile and bloats the repository forever.  See
      # USER-GUIDE.md "Preparing images" for how to shrink them.
      - name: Warn about oversized images (soft)
        run: |
          count=0
          while IFS= read -r -d '' f; do
            kb=$(( $(stat -c %s "$f") / 1024 ))
            echo "::warning file=$f::$f is ${kb} KB. Please resize to under ~1 MB (see USER-GUIDE.md, Preparing images)."
            count=$((count + 1))
          done < <(find assets -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' \) -size +1024k -print0)
          echo "Oversized images: ${count}"

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Validate internal links on indexable pages
        run: |
          ruby - <<'RUBY'
          require "uri"

          site_root = File.expand_path("_site")
          sitemap_path = File.join(site_root, "sitemap.xml")
          failures = []

          unless File.exist?(sitemap_path)
            abort("Missing _site/sitemap.xml; cannot validate internal links.")
          end

          sitemap = File.read(sitemap_path)
          locs = sitemap.scan(/<loc>([^<]+)<\/loc>/).flatten

          path_exists_in_site = lambda do |path|
            clean = path.split("#", 2).first.split("?", 2).first
            normalized = clean.start_with?("/") ? clean : "/#{clean}"
            return true if normalized == "/"

            direct = File.join(site_root, normalized.sub(%r{^/}, ""))
            index = File.join(site_root, normalized.sub(%r{^/}, ""), "index.html")

            File.file?(direct) || File.file?(index)
          end

          html_files = []

          locs.each do |loc|
            begin
              uri = URI.parse(loc)
            rescue URI::InvalidURIError
              failures << "Invalid sitemap URL: #{loc}"
              next
            end

            path = uri.path.to_s
            path = "/" if path.empty?

            html_file =
              if path == "/"
                File.join(site_root, "index.html")
              elsif path.end_with?("/")
                File.join(site_root, path.sub(%r{^/}, ""), "index.html")
              else
                File.join(site_root, path.sub(%r{^/}, ""))
              end

            if File.file?(html_file)
              html_files << html_file
            else
              failures << "Sitemap URL does not map to generated file: #{loc} -> #{html_file}"
            end
          end

          html_files.uniq.each do |html_file|
            html = File.read(html_file)
            source_path = html_file.sub("#{site_root}/", "")
            page_dir = File.dirname(html_file)

            links = html.scan(/(?:href|src)=["']([^"']+)["']/i).flatten
            links.each do |raw|
              next if raw.nil? || raw.empty?
              target = raw.strip
              next if target.start_with?("#", "mailto:", "tel:", "javascript:", "data:")
              next if target.start_with?("//")
              next if target.match?(/\Ahttps?:\/\//i)

              if target.start_with?("/")
                unless path_exists_in_site.call(target)
                  failures << "#{source_path}: broken absolute internal link #{target}"
                end
              else
                rel = target.split("#", 2).first.split("?", 2).first
                next if rel.empty?
                candidate = File.expand_path(rel, page_dir)
                unless candidate.start_with?(site_root)
                  failures << "#{source_path}: relative link escapes site root #{target}"
                  next
                end

                exists = File.file?(candidate)
                exists ||= File.file?(File.join(candidate, "index.html")) if File.directory?(candidate)
                failures << "#{source_path}: broken relative internal link #{target}" unless exists
              end
            end
          end

          if failures.any?
            puts "Internal link validation failed:"
            failures.each { |f| puts "  - #{f}" }
            exit 1
          end

          puts "Internal link validation passed for indexable pages."
          RUBY

      - name: Audit external links (soft fail)
        continue-on-error: true
        run: |
          ruby - <<'RUBY'
          require "uri"
          require "net/http"
          require "set"

          site_root = File.expand_path("_site")
          sitemap_path = File.join(site_root, "sitemap.xml")

          abort("Missing _site/sitemap.xml; cannot audit external links.") unless File.exist?(sitemap_path)

          sitemap = File.read(sitemap_path)
          locs = sitemap.scan(/<loc>([^<]+)<\/loc>/).flatten

          html_files = []
          locs.each do |loc|
            begin
              uri = URI.parse(loc)
            rescue URI::InvalidURIError
              next
            end

            path = uri.path.to_s
            path = "/" if path.empty?

            html_file =
              if path == "/"
                File.join(site_root, "index.html")
              elsif path.end_with?("/")
                File.join(site_root, path.sub(%r{^/}, ""), "index.html")
              else
                File.join(site_root, path.sub(%r{^/}, ""))
              end

            html_files << html_file if File.file?(html_file)
          end

          external_urls = Set.new
          html_files.uniq.each do |html_file|
            html = File.read(html_file)
            html.scan(/(?:href|src)=["']([^"']+)["']/i).flatten.each do |raw|
              next if raw.nil? || raw.empty?
              target = raw.strip
              next unless target.match?(/\Ahttps?:\/\//i)
              external_urls << target
            end
          end

          def request_status(url, method: :head, redirects: 5)
            uri = URI.parse(url)
            raise "unsupported scheme" unless uri.is_a?(URI::HTTP)

            http = Net::HTTP.new(uri.host, uri.port)
            http.use_ssl = (uri.scheme == "https")
            http.open_timeout = 8
            http.read_timeout = 8

            path = uri.request_uri
            req =
              if method == :head
                Net::HTTP::Head.new(path, { "User-Agent" => "brianbarnardart-link-checker/1.0" })
              else
                Net::HTTP::Get.new(path, { "User-Agent" => "brianbarnardart-link-checker/1.0" })
              end

            res = http.request(req)
            code = res.code.to_i

            if code >= 300 && code < 400 && redirects > 0
              location = res["location"]
              raise "redirect without location header" if location.nil? || location.strip.empty?
              redirected = URI.join(url, location).to_s
              return request_status(redirected, method: method, redirects: redirects - 1)
            end

            if method == :head && (code == 405 || code == 501)
              return request_status(url, method: :get, redirects: redirects)
            end

            code
          end

          hard_failures = []
          access_blocked = []
          request_errors = []
          checked = 0

          external_urls.each do |url|
            checked += 1
            begin
              code = request_status(url)
              if code >= 200 && code < 400
                next
              elsif [401, 403, 429].include?(code)
                access_blocked << "#{url} -> HTTP #{code}"
              else
                hard_failures << "#{url} -> HTTP #{code}"
              end
            rescue StandardError => e
              request_errors << "#{url} -> #{e.class}: #{e.message}"
            end
          end

          puts "External links checked: #{checked}"

          if access_blocked.any?
            puts "External links blocked to CI/bot-like requests (non-fatal):"
            access_blocked.each { |f| puts "  - #{f}" }
            access_blocked.each { |f| puts "::warning::External link blocked: #{f}" }
          end

          if request_errors.any?
            puts "External links with request errors (non-fatal, review):"
            request_errors.each { |f| puts "  - #{f}" }
            request_errors.each { |f| puts "::warning::External link request error: #{f}" }
          end

          if hard_failures.any?
            puts "External links with likely real issues (soft-fail warning):"
            hard_failures.each { |f| puts "  - #{f}" }
            hard_failures.each { |f| puts "::warning::External link likely broken: #{f}" }
          else
            puts "External link audit found no likely broken links."
          end

          puts "External link audit completed."
          RUBY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
